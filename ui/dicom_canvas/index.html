<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><style>
body{margin:0;background:transparent;font-family:Arial,sans-serif}
canvas{display:block;width:100%;background:#10151c;border-radius:6px;touch-action:none;outline-offset:-3px}
canvas:focus-visible{outline:2px solid #55d6be}
</style></head>
<body><canvas tabindex="0" aria-label="DICOM 영상. 펜 그림은 Ctrl+Z 되돌리기, Ctrl+Y 다시 실행, Ctrl+A 전체 선택, Ctrl+C 복사, Ctrl+V 붙여넣기가 가능합니다."></canvas>
<script src="ink.js"></script>
<script>
const canvas = document.querySelector('canvas');
const ctx = canvas.getContext('2d');
let args, image, area, drag, preview, pointerPosition;
let loadVersion = 0, eventNumber = 0;
const ink = new InkLayer();
const eraserRadius = 12; // 화면 픽셀 기준 지우개 반경
function send(type, fields) {
    window.parent.postMessage({isStreamlitMessage:true, type, ...fields}, '*');
}
function emit(kind, fields) {
    if (!args || args.disabled || args.read_only) return;
    send('streamlit:setComponentValue', {dataType:'json', value:{
        id:`${Date.now()}-${++eventNumber}`, token:args.token, epoch:args.epoch, kind, ...fields
    }});
}
function draw() {
    if (!args || !image) return;
    const width = Math.max(1, canvas.parentElement.clientWidth);
    // Both panes use the same viewport height, independently of image aspect ratio.
    let availableHeight = args.max_height || 420;
    try {
        const frameTop = window.frameElement.getBoundingClientRect().top;
        availableHeight = window.parent.innerHeight - frameTop - 64;
    } catch {
        // Retain the bounded height if the host disallows parent-frame access.
    }
    const height = Math.max(150, Math.min(args.max_height || 420, availableHeight));
    canvas.width = Math.round(width * devicePixelRatio);
    canvas.height = Math.round(height * devicePixelRatio);
    canvas.style.height = `${height}px`;
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    ctx.clearRect(0, 0, width, height);
    const crop = preview || args.crop;
    const scale = Math.min(width / crop[2], height / crop[3]);
    area = {x:(width-crop[2]*scale)/2, y:(height-crop[3]*scale)/2,
            width:crop[2]*scale, height:crop[3]*scale, crop, scale};
    ctx.drawImage(image, ...crop, area.x, area.y, area.width, area.height);
    const points = [...args.points];
    if (points.length === 1 && pointerPosition && args.mode === 'measure') points.push(pointerPosition);
    ctx.save();
    ctx.beginPath(); ctx.rect(area.x,area.y,area.width,area.height); ctx.clip();
    // 박스와 ROI는 항상 원본 좌표로 보관하고 현재 crop의 배율로만 변환한다.
    for (const box of args.boxes || []) {
        ctx.strokeStyle = box.color;
        ctx.lineWidth = 2;
        const bx = area.x + (box.xmin-crop[0])*scale;
        const by = area.y + (box.ymin-crop[1])*scale;
        ctx.strokeRect(bx, by, (box.xmax-box.xmin)*scale, (box.ymax-box.ymin)*scale);
        ctx.font = 'bold 12px Arial';
        const text = String(box.label || '');
        ctx.fillStyle = '#10151c';
        ctx.fillRect(bx, Math.max(area.y,by-17), ctx.measureText(text).width+6, 17);
        ctx.fillStyle = box.color;
        ctx.fillText(text,bx+3,Math.max(area.y+13,by-4));
    }
    let roi = args.roi;
    if (args.mode === 'roi' && drag && pointerPosition) {
        roi = {x:Math.min(drag.start.point[0],pointerPosition[0]),
               y:Math.min(drag.start.point[1],pointerPosition[1]),
               w:Math.abs(drag.start.point[0]-pointerPosition[0])+1,
               h:Math.abs(drag.start.point[1]-pointerPosition[1])+1};
    }
    if (roi) {
        ctx.strokeStyle = '#ff85d0'; ctx.lineWidth = 2; ctx.setLineDash([6,4]);
        ctx.strokeRect(area.x+(roi.x-crop[0])*scale,area.y+(roi.y-crop[1])*scale,
                       roi.w*scale,roi.h*scale);
        ctx.setLineDash([]);
    }
    ink.draw(ctx, area, crop, scale);
    if (drag?.marquee && drag.moved) {
        const [sx,sy] = drag.start.point, [ex,ey] = drag.last;
        const x = area.x+(Math.min(sx,ex)+0.5-crop[0])*scale;
        const y = area.y+(Math.min(sy,ey)+0.5-crop[1])*scale;
        ctx.save();
        ctx.fillStyle = 'rgba(85,214,255,0.12)'; ctx.strokeStyle = '#55d6ff';
        ctx.lineWidth = 1; ctx.setLineDash([5,4]);
        ctx.fillRect(x,y,Math.abs(ex-sx)*scale,Math.abs(ey-sy)*scale);
        ctx.strokeRect(x,y,Math.abs(ex-sx)*scale,Math.abs(ey-sy)*scale);
        ctx.restore();
    }
    if (args.mode === 'eraser' && pointerPosition) {
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(area.x+(pointerPosition[0]+0.5-crop[0])*scale,
                area.y+(pointerPosition[1]+0.5-crop[1])*scale,eraserRadius,0,2*Math.PI);
        ctx.stroke();
    }
    ctx.lineWidth = 2; ctx.strokeStyle = '#4dffcf'; ctx.fillStyle = '#4dffcf';
    const screenPoints = points.map(p => [area.x+(p[0]+0.5-crop[0])*scale,
                                         area.y+(p[1]+0.5-crop[1])*scale]);
    if (screenPoints.length === 2) {
        ctx.beginPath(); ctx.moveTo(...screenPoints[0]); ctx.lineTo(...screenPoints[1]); ctx.stroke();
    }
    screenPoints.forEach(p => {ctx.beginPath();ctx.arc(...p,4,0,Math.PI*2);ctx.fill();});
    if (screenPoints.length === 2 && args.label) {
        const [x,y] = screenPoints[1];
        ctx.font = 'bold 15px Arial';
        const labelWidth = ctx.measureText(args.label).width + 12;
        const tx = Math.max(area.x, Math.min(x+8, area.x+area.width-labelWidth));
        const ty = Math.max(area.y+22, Math.min(y-10, area.y+area.height));
        ctx.fillStyle = '#10151c'; ctx.fillRect(tx,ty-20,labelWidth,25);
        ctx.fillStyle = '#4dffcf'; ctx.fillText(args.label,tx+6,ty-2);
    }
    ctx.restore();
    canvas.style.cursor = args.read_only ? 'default' :
        (drag?.marquee ? 'crosshair' : (args.mode === 'ink_select' ? (drag ? 'grabbing' : 'move') :
        (['measure','roi','pen','eraser'].includes(args.mode) ? 'crosshair' : (drag ? 'grabbing' : 'zoom-in'))));
    send('streamlit:setFrameHeight', {height:Math.ceil(height)});
}
function coordinate(event, clamp = false) {
    if (!area) return null;
    const bounds = canvas.getBoundingClientRect();
    let x = event.clientX - bounds.left, y = event.clientY - bounds.top;
    if (!clamp && (x<area.x || y<area.y || x>area.x+area.width || y>area.y+area.height)) return null;
    x = Math.max(area.x,Math.min(area.x+area.width,x));
    y = Math.max(area.y,Math.min(area.y+area.height,y));
    return {x,y, point:[Math.max(0,Math.min(args.cols-1,area.crop[0]+(x-area.x)/area.width*area.crop[2]-0.5)),
                        Math.max(0,Math.min(args.rows-1,area.crop[1]+(y-area.y)/area.height*area.crop[3]-0.5))]};
}
function navigate(crop, zoom) {
    const x = args.cols === crop[2] ? 50 : crop[0]/(args.cols-crop[2])*100;
    const y = args.rows === crop[3] ? 50 : crop[1]/(args.rows-crop[3])*100;
    emit('navigate', {zoom, x:Math.round(x), y:Math.round(y)});
}
canvas.addEventListener('pointerdown', event => {
    if (!args || args.disabled || args.read_only || event.isPrimary === false || drag) return;
    const marquee = event.button === 2 && args.ink_enabled && ['pen','ink_select'].includes(args.mode);
    if (event.button !== 0 && !marquee) return;
    const start = coordinate(event);
    if (!start) return;
    canvas.focus();
    event.preventDefault();
    drag = {start, crop:[...args.crop], moved:false, pointerId:event.pointerId, last:start.point,
            button:event.button, marquee, additive:!!event.shiftKey};
    pointerPosition = start.point;
    if (marquee) {
        canvas.setPointerCapture(event.pointerId);
        draw(); return;
    }
    const tolerance = 6/area.scale;
    drag.inkMoving = args.ink_enabled && (args.mode === 'ink_select' ||
        (args.mode === 'pen' && ink.hitSelected(start.point,tolerance)));
    if (drag.inkMoving) {
        if (event.shiftKey || !ink.hitSelected(start.point,tolerance)) {
            ink.selectAt(start.point,tolerance,event.shiftKey);
        }
        if (ink.hitSelected(start.point,tolerance)) ink.beginTranslate();
    } else if (args.mode === 'pen') ink.begin(start.point,args.pen_color,args.pen_width,area.scale);
    if (args.mode === 'eraser') {
        ink.beginErase();
        ink.erase(start.point,start.point,eraserRadius/area.scale);
    }
    canvas.setPointerCapture(event.pointerId);
    draw();
});
canvas.addEventListener('pointermove', event => {
    if (!args || (drag && event.pointerId !== drag.pointerId)) return;
    const position = coordinate(event,!!drag?.marquee);
    pointerPosition = position?.point;
    if (drag?.marquee) {
        event.preventDefault();
        if (position) {
            drag.last = position.point;
            drag.moved ||= Math.hypot(position.x-drag.start.x,position.y-drag.start.y)>4;
        }
    } else if (drag?.inkMoving) {
        event.preventDefault();
        if (pointerPosition) ink.translate(pointerPosition[0]-drag.start.point[0],
            pointerPosition[1]-drag.start.point[1],args.cols,args.rows);
    } else if (drag && ['pen','eraser'].includes(args.mode)) {
        event.preventDefault();
        const events = event.getCoalescedEvents?.() || [event];
        for (const sample of events.length ? events : [event]) {
            const position = coordinate(sample)?.point;
            if (!position) continue;
            if (args.mode === 'pen') ink.move(position);
            else ink.erase(drag.last,position,eraserRadius/area.scale);
            drag.last = position;
        }
    }
    if (drag && args.mode === 'navigate') {
        const bounds = canvas.getBoundingClientRect();
        const dx = event.clientX-bounds.left-drag.start.x;
        const dy = event.clientY-bounds.top-drag.start.y;
        drag.moved ||= Math.hypot(dx,dy)>4;
        if (drag.moved) {
            preview = [...drag.crop];
            preview[0] = Math.max(0,Math.min(args.cols-preview[2],drag.crop[0]-dx/area.width*preview[2]));
            preview[1] = Math.max(0,Math.min(args.rows-preview[3],drag.crop[1]-dy/area.height*preview[3]));
        }
    }
    draw();
});
canvas.addEventListener('pointerup', event => {
    if (!drag || event.pointerId !== drag.pointerId || event.button !== drag.button) return;
    const start = drag.start, moved = drag.moved;
    const end = coordinate(event,!!drag.marquee);
    const previousPoint = drag.last;
    const inkMoving = drag.inkMoving;
    const marquee = drag.marquee, additive = drag.additive;
    drag = null;
    canvas.releasePointerCapture(event.pointerId);
    if (marquee) {
        if (moved || (end && Math.hypot(end.x-start.x,end.y-start.y)>4)) {
            ink.selectRect(start.point,end?.point || previousPoint,additive);
        }
    } else if (inkMoving) {
        if (end) ink.translate(end.point[0]-start.point[0],end.point[1]-start.point[1],args.cols,args.rows);
        ink.finishTranslate();
    } else if (args.mode === 'pen') {
        ink.finish(end?.point);
    } else if (args.mode === 'eraser') {
        if (end) ink.erase(previousPoint,end.point,eraserRadius/area.scale);
        ink.finishErase();
    } else if (args.mode === 'roi') {
        if (end) emit('roi', {start:start.point,end:end.point});
    } else if (args.mode === 'measure') {
        const end = coordinate(event);
        if (end && Math.hypot(end.x-start.x,end.y-start.y)<=4) emit('measure',{point:end.point});
    } else if (moved && preview) {
        navigate(preview,args.zoom);
    } else {
        const zoom = Math.min(4, Math.round((args.zoom+0.5)*10)/10);
        const w = Math.max(1,Math.round(args.cols/zoom));
        const h = Math.max(1,Math.round(args.rows/zoom));
        const crop = [Math.max(0,Math.min(args.cols-w,start.point[0]+0.5-w/2)),
                      Math.max(0,Math.min(args.rows-h,start.point[1]+0.5-h/2)),w,h];
        navigate(crop,zoom);
    }
    if (event.pointerType === 'touch') pointerPosition = null;
    draw();
});
canvas.addEventListener('contextmenu', event => {
    if (!args || args.disabled || args.read_only) return;
    event.preventDefault();
    if (args.mode !== 'navigate') return;
    const position = coordinate(event);
    if (!position || args.zoom <= 1) return;
    const zoom = Math.max(1, Math.round((args.zoom-0.5)*10)/10);
    const w = Math.max(1, Math.round(args.cols/zoom));
    const h = Math.max(1, Math.round(args.rows/zoom));
    // Preserve the image point under the cursor while reducing magnification.
    const u = (position.x-area.x)/area.width;
    const v = (position.y-area.y)/area.height;
    const crop = [Math.max(0, Math.min(args.cols-w,position.point[0]+0.5-u*w)),
                  Math.max(0, Math.min(args.rows-h,position.point[1]+0.5-v*h)),w,h];
    preview = null;
    navigate(crop,zoom);
});
canvas.addEventListener('pointercancel', event => {
    if (drag && event.pointerId !== drag.pointerId) return;
    ink.cancel();drag=null;preview=null;pointerPosition=null;draw();
});
canvas.addEventListener('pointerleave', () => {pointerPosition=null;draw();});
// 영상에 포커스가 있을 때만 처리해 메모·검색창의 입력 단축키를 보존한다.
canvas.addEventListener('keydown', event => {
    if (!args || args.disabled || args.read_only || !args.ink_enabled ||
        event.target !== canvas || event.isComposing || event.altKey) return;
    if (event.key === 'Escape') {
        ink.cancel(); ink.deselect();
        if (drag) canvas.releasePointerCapture(drag.pointerId);
        drag = null; preview = null; pointerPosition = null;
        event.preventDefault(); draw(); return;
    }
    if (drag) return;
    const key = event.code?.startsWith('Key') ? event.code.slice(3).toLowerCase() : event.key.toLowerCase();
    const modifier = event.ctrlKey || event.metaKey;
    if (modifier && ['z','y','a','c','v'].includes(key)) {
        event.preventDefault();
        if (event.repeat && ['c','v'].includes(key)) return;
        if (key === 'z') event.shiftKey ? ink.redo() : ink.undo();
        if (key === 'y') ink.redo();
        if (key === 'a') ink.selectAll();
        if (key === 'c') ink.copy();
        if (key === 'v' && area) ink.paste(args.cols,args.rows,10/area.scale);
        draw();
    } else if (!modifier && ['Delete','Backspace'].includes(event.key) && ink.selected.size) {
        event.preventDefault(); ink.deleteSelected(); draw();
    }
});
window.addEventListener('resize',draw);
window.addEventListener('message', event => {
    if (event.source !== window.parent || event.data.type !== 'streamlit:render') return;
    ink.cancel();
    args = {...event.data.args, disabled:event.data.disabled};
    ink.setContext(args.drawing_token || args.token);
    ink.applyCommand(args.pen_command);
    preview = null; drag = null; pointerPosition = null;
    area = null; image = null;
    const version = ++loadVersion;
    const next = new Image();
    next.onload = () => {if (version===loadVersion) {image=next;draw();}};
    next.src = `data:image/png;base64,${args.image}`;
});
send('streamlit:componentReady',{apiVersion:1});
</script></body></html>
